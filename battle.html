<meta charset="utf-8">
<title>Battle for #1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout: a single 16:9 "screen" with a slim title row above and a transport bar below */
:root{
  --bg:#120f24; --panel:#1d1838; --fg:#fff8ee; --muted:#a59fc4; --line:rgba(255,248,238,.16); --accent:#ffe14d;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body)}
main{max-width:1200px;margin:0 auto;display:grid;gap:14px;padding-block:20px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.4vw,44px);margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.screen{width:100%;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;border:3px solid #000;box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(0,0,0,.45);background:#000}
canvas{width:100%;height:100%;display:block}
.bar{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 8px}
button{font-family:var(--display);font-size:16px;letter-spacing:.03em;color:#1a1530;background:var(--accent);border:2px solid #000;border-radius:999px;padding:7px 16px;cursor:pointer;box-shadow:0 3px 0 #000}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line);box-shadow:none}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:9ch;text-align:right}
</style>

<main>
  <header>
    <h1>Battle for <span>#1</span></h1>
    <span class="sub">A 15-second parody. Not affiliated with Anthropic, OpenAI or Meta.</span>
  </header>
  <div class="screen"><canvas id="cv" role="img" aria-label="Animated cartoon: the Claude and ChatGPT logos fight over a leaderboard, a chat window, a tug-of-war bar and a podium, then the Meta logo sneaks in and takes first place."></canvas></div>
  <div class="bar">
    <button id="play" type="button">Pause</button>
    <button id="replay" type="button" class="ghost">Replay</button>
    <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" aria-label="Timeline">
    <span class="time" id="time">0.0 / 15.0s</span>
  </div>
</main>

<script>
(() => {
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const OUT='#1a1530', DISP='"Lilita One","Arial Rounded MT Bold",sans-serif', BODY='"Rubik",system-ui,sans-serif';
const COR='#D97757', TEAL='#10A37F', YEL='#FFE14D';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=x=>1-Math.pow(1-clamp(x),3), easeIn=x=>Math.pow(clamp(x),2);
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const backOut=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const PI=Math.PI;
let T=0;

function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,Math.min(r,h/2,w/2));else ctx.rect(x,y,w,h);}
function txt(s,x,y,size,fill,stroke=OUT,lw=size*.14,font=DISP,align='center'){
  ctx.font=`${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';
  if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);}
  ctx.fillStyle=fill;ctx.fillText(s,x,y);
}
function star(x,y,r,n,inner,seed=0){ctx.beginPath();for(let i=0;i<n*2;i++){const a=i/(n*2)*PI*2-PI/2,q=(i%2?r*inner:r)*(1+.1*Math.sin(seed+i*2.3));ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}ctx.closePath();}
function pow(x,y,r,text,lt,dur,rot=-.15){
  if(lt<0||lt>dur) return;
  const sc=backOut(lt/.16), a=1-clamp((lt-dur+.12)/.12);
  ctx.save(); ctx.globalAlpha=a; ctx.translate(x,y); ctx.rotate(rot+Math.sin(lt*30)*.04); ctx.scale(sc,sc);
  star(0,0,r,12,.62,x); ctx.fillStyle=YEL; ctx.fill(); ctx.lineWidth=7; ctx.strokeStyle=OUT; ctx.lineJoin='round'; ctx.stroke();
  txt(text,0,4,r*.4,'#FF3B3B'); ctx.restore();
}
function card(x,y,w,h,fill='#FFF8EE',r=28){ctx.fillStyle=OUT;rr(x+12,y+12,w,h,r);ctx.fill();rr(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=OUT;ctx.stroke();}
function stripes(col,stripe){
  ctx.fillStyle=col; ctx.fillRect(0,0,1600,900); ctx.fillStyle=stripe;
  const off=(T*70)%120;
  for(let i=-2;i<24;i++){const x=i*120+off;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+55,0);ctx.lineTo(x+55-900,900);ctx.lineTo(x-900,900);ctx.fill();}
}
function banner(text,u,dur){
  if(u>dur) return;
  const y=lerp(-70,72,backOut(u/.3))-easeIn((u-dur+.25)/.25)*160;
  ctx.font=`44px ${DISP}`; const w=ctx.measureText(text).width+70;
  ctx.save(); ctx.translate(800,y); ctx.rotate(-.02);
  ctx.fillStyle=OUT; rr(-w/2+6,-34+6,w,68,34); ctx.fill();
  ctx.fillStyle='#fff'; rr(-w/2,-34,w,68,34); ctx.fill(); ctx.lineWidth=5; ctx.strokeStyle=OUT; ctx.stroke();
  txt(text,0,3,44,OUT,null); ctx.restore();
}

/* ---------- characters (parody logo-bots) ---------- */
function glove(x,y,s,dir,punch,back){
  const r=s*.3; ctx.save(); ctx.translate(x,y); ctx.scale(dir,1);
  ctx.strokeStyle=OUT; ctx.lineWidth=Math.max(2,s*.06); ctx.lineJoin='round';
  if(punch>.3){ctx.lineCap='round';ctx.lineWidth=Math.max(2,s*.04);for(const ly of[-.5,0,.5]){ctx.beginPath();ctx.moveTo(-r*1.9,ly*r);ctx.lineTo(-r*1.9-punch*s*.6,ly*r);ctx.stroke();}ctx.lineWidth=Math.max(2,s*.06);}
  ctx.fillStyle='#fff'; rr(-r*1.55,-r*.55,r*.6,r*1.1,r*.2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=back?'#B52A35':'#E63946';
  ctx.beginPath(); ctx.ellipse(0,0,r*1.1,r,0,0,7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-r*.1,-r*.78,r*.45,r*.28,-.3,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(r*.35,-r*.3,r*.25,r*.11,-.5,0,7); ctx.fill();
  ctx.restore();
}
const RAYS=[1,.82,.95,.78,1,.86,.92,.8,.98,.84,.9,.8];
function lemni(s){ctx.beginPath();for(let i=0;i<=90;i++){const a=i/90*PI*2,d=1+Math.sin(a)**2;ctx.lineTo(s*1.05*Math.cos(a)/d,s*1.36*Math.sin(a)*Math.cos(a)/d);}ctx.closePath();}
function body(kind,s,t){
  ctx.lineJoin='round'; ctx.lineCap='round';
  if(kind==='claude'){
    ctx.save(); ctx.rotate(t*.6);
    for(const [col,lw] of [[OUT,.28],[COR,.17]]){
      ctx.strokeStyle=col; ctx.lineWidth=s*lw;
      for(let i=0;i<12;i++){const a=i/12*PI*2+.08*Math.sin(i*3.1),l=s*RAYS[i]*(1+.04*Math.sin(t*10+i));
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*l,Math.sin(a)*l); ctx.stroke();}
    }
    ctx.restore();
    ctx.fillStyle=COR; ctx.beginPath(); ctx.arc(0,0,s*.47,0,7); ctx.fill();
  } else if(kind==='gpt'){
    ctx.fillStyle=TEAL; ctx.strokeStyle=OUT; ctx.lineWidth=s*.07; ctx.beginPath(); ctx.arc(0,0,s*.95,0,7); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.rotate(-t*.4); ctx.strokeStyle='#fff'; ctx.lineWidth=s*.09;
    for(let k=0;k<6;k++){ctx.save();ctx.rotate(k*PI/3);rr(-s*.17,-s*.74,s*.34,s*.62,s*.17);ctx.stroke();ctx.restore();}
    ctx.restore();
    ctx.fillStyle=TEAL; ctx.beginPath(); ctx.arc(0,0,s*.4,0,7); ctx.fill();
  } else {
    lemni(s); ctx.strokeStyle=OUT; ctx.lineWidth=s*.38; ctx.stroke();
    const g=ctx.createLinearGradient(-s,0,s,0); g.addColorStop(0,'#0064E0'); g.addColorStop(1,'#1FA6FF');
    lemni(s); ctx.strokeStyle=g; ctx.lineWidth=s*.25; ctx.stroke();
  }
}
function face(kind,s,look,mood,t){
  ctx.strokeStyle=OUT; ctx.fillStyle=OUT; ctx.lineCap='round'; ctx.lineJoin='round';
  if(kind==='meta'&&mood!=='shock'){
    const ex=s*.6, er=s*.17;
    ctx.lineWidth=s*.08; ctx.beginPath(); ctx.moveTo(-ex+er,-er*.35); ctx.quadraticCurveTo(0,-er*.9,ex-er,-er*.35); ctx.stroke();
    for(const sg of[-1,1]){ctx.fillStyle=OUT;ctx.beginPath();ctx.ellipse(sg*ex,0,er*1.55,er*1.05,0,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.ellipse(sg*ex-er*.6,-er*.35,er*.38,er*.16,-.4,0,7);ctx.fill();}
    ctx.lineWidth=s*.06; ctx.beginPath(); ctx.moveTo(-s*.12,s*.34); ctx.quadraticCurveTo(s*.02,s*.42,s*.16,s*.27); ctx.stroke();
    return;
  }
  const ex=kind==='meta'?s*.6:s*.17, ey=kind==='meta'?0:-s*.06, er=s*(kind==='meta'?.15:.13);
  const blink=!mood.startsWith('d')&&((t+(kind==='gpt'?.9:0))%2.6)<.09;
  for(const sg of[-1,1]){
    const x=sg*ex, y=ey;
    if(mood==='dizzy'){ctx.lineWidth=s*.035;ctx.beginPath();for(let a=0;a<11;a+=.35){const q=a*er*.09;ctx.lineTo(x+Math.cos(a+t*9*sg)*q,y+Math.sin(a+t*9*sg)*q);}ctx.stroke();continue;}
    ctx.fillStyle='#fff'; ctx.lineWidth=Math.max(1.5,s*.04);
    ctx.beginPath(); ctx.ellipse(x,y,er,blink?er*.15:er*1.2,0,0,7); ctx.fill(); ctx.stroke();
    if(!blink){ctx.fillStyle=OUT;ctx.beginPath();ctx.arc(x+look[0]*er*.4,y+look[1]*er*.45,mood==='shock'?er*.32:er*.55,0,7);ctx.fill();}
    if(mood==='angry'){ctx.lineWidth=s*.065;ctx.beginPath();ctx.moveTo(x+sg*er*1.1,y-er*1.95);ctx.lineTo(x-sg*er*.9,y-er*1.25);ctx.stroke();}
  }
  const my=kind==='meta'?s*.32:s*.25; ctx.lineWidth=Math.max(1.5,s*.045);
  if(mood==='angry'){ctx.fillStyle='#fff';rr(-s*.12,my-s*.05,s*.24,s*.1,s*.03);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(0,my-s*.05);ctx.lineTo(0,my+s*.05);ctx.stroke();}
  else if(mood==='shock'){ctx.fillStyle=OUT;ctx.beginPath();ctx.ellipse(0,my,s*.06,s*.085,0,0,7);ctx.fill();}
  else if(mood==='dizzy'){ctx.beginPath();for(let i=0;i<=6;i++)ctx.lineTo(-s*.12+i*s*.04,my+(i%2?s*.03:-s*.02));ctx.stroke();}
  else{ctx.beginPath();ctx.arc(0,my-s*.08,s*.12,PI*.2,PI*.8);ctx.stroke();}
}
function fighter(kind,x,y,s,o={}){
  const {rot=0,sx=1,sy=1,dir=1,look=[dir*.6,0],mood='angry',punch=0,alpha=1,shadow=true,ground=y+s*1.15}=o;
  const gloves=kind!=='meta';
  ctx.save(); ctx.globalAlpha=alpha;
  if(shadow){const k=clamp(1-(ground-y-s)/400,.3,1);ctx.fillStyle='rgba(26,21,48,.25)';ctx.beginPath();ctx.ellipse(x,ground,s*.9*k,s*.17*k,0,0,7);ctx.fill();}
  ctx.translate(x,y); ctx.rotate(rot); ctx.scale(sx,sy);
  const bob=Math.sin(T*9+(kind==='gpt'?1.5:0))*s*.05;
  if(gloves) glove(-dir*s*.82,s*.38+bob,s,dir,0,true);
  body(kind,s,T); face(kind,s,look,mood,T);
  if(gloves) glove(dir*(s*.88+punch*s*.75),s*.18-bob,s,dir,punch,false);
  ctx.restore();
}
function dizzyStars(x,y,s){for(let i=0;i<3;i++){const a=T*5+i*2.09;star(x+Math.cos(a)*s*.75,y-s*1.1+Math.sin(a)*s*.2,s*.14,5,.45);ctx.fillStyle=YEL;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=OUT;ctx.stroke();}}
function crown(x,y,w,rot=0){
  const h=w*.62; ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.beginPath(); ctx.moveTo(-w/2,h/2); ctx.lineTo(-w/2,-h/4); ctx.lineTo(-w/4,h/8); ctx.lineTo(0,-h/2); ctx.lineTo(w/4,h/8); ctx.lineTo(w/2,-h/4); ctx.lineTo(w/2,h/2); ctx.closePath();
  ctx.fillStyle='#FFD23F'; ctx.fill(); ctx.lineWidth=6; ctx.strokeStyle=OUT; ctx.lineJoin='round'; ctx.stroke();
  [[-w/4,'#FF3B3B'],[0,'#2D7DFF'],[w/4,'#FF3B3B']].forEach(([gx,c])=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(gx,h/4,w*.07,0,7);ctx.fill();ctx.lineWidth=3;ctx.stroke();});
  [[-w/2,-h/4],[0,-h/2],[w/2,-h/4]].forEach(([px,py])=>{ctx.fillStyle='#FFD23F';ctx.beginPath();ctx.arc(px,py,w*.06,0,7);ctx.fill();ctx.lineWidth=3;ctx.stroke();});
  ctx.restore();
}
function namePill(text,x,y,col,sc=1){
  ctx.font=`38px ${DISP}`; const w=ctx.measureText(text).width+44;
  ctx.save(); ctx.translate(x,y); ctx.scale(sc,sc);
  ctx.fillStyle=OUT; rr(-w/2+5,-27+5,w,54,27); ctx.fill(); ctx.fillStyle=col; rr(-w/2,-27,w,54,27); ctx.fill(); ctx.lineWidth=5; ctx.strokeStyle=OUT; ctx.stroke();
  txt(text,0,3,38,'#fff',null); ctx.restore();
}

/* ---------- scenes ---------- */
const SC=[{n:'intro',a:0,b:1.8},{n:'r1',a:1.8,b:4.6},{n:'r2',a:4.6,b:7.4},{n:'r3',a:7.4,b:10.2},{n:'r4',a:10.2,b:12},{n:'meta',a:12,b:15}];
const IMPACTS=[2.45,3.15,3.85,6.65,9.55,11.0,13.6];
const scenes={
intro(u){
  const off=(1-easeOut(u/.3))*900;
  ctx.fillStyle='#14112b'; ctx.fillRect(0,0,1600,900);
  ctx.fillStyle=COR; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(880-off,0); ctx.lineTo(720-off,900); ctx.lineTo(0,900); ctx.fill();
  ctx.fillStyle=TEAL; ctx.beginPath(); ctx.moveTo(880+off,0); ctx.lineTo(1600,0); ctx.lineTo(1600,900); ctx.lineTo(720+off,900); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.08)';
  for(let i=0;i<40;i++)for(let j=0;j<23;j++){ctx.beginPath();ctx.arc(i*42+((T*30)%42),j*42,4,0,7);ctx.fill();}
  const cp=backOut(u/.45), land=clamp((u-.45)/.25), sq=Math.sin(land*PI);
  const jab=k=>u>.7?Math.max(0,Math.sin((u-.7)*16+k))*.6:0;
  fighter('claude',lerp(-260,440,cp),450,150,{dir:1,sx:1+.12*sq,sy:1-.18*sq,punch:jab(0),ground:640});
  fighter('gpt',lerp(1860,1160,cp),450,150,{dir:-1,sx:1+.12*sq,sy:1-.18*sq,punch:jab(1.6),ground:640});
  const np=backOut((u-.3)/.3); if(u>.3){namePill('Claude',440,700,'#B85A3D',np);namePill('ChatGPT',1160,700,'#0C7D61',np);}
  const vs=backOut((u-.4)/.25);
  if(u>.4){ctx.save();ctx.translate(800,430);ctx.scale(vs*(1+.04*Math.sin(u*22)),vs*(1+.04*Math.sin(u*22)));ctx.rotate(-.12);
    ctx.save();ctx.rotate(T*1.5);star(0,0,175,14,.68);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=7;ctx.strokeStyle=OUT;ctx.stroke();ctx.restore();
    txt('VS',0,10,190,YEL,OUT,22);ctx.restore();}
  if(u>.45){const p=backOut((u-.45)/.3);ctx.save();ctx.translate(800,820);ctx.scale(p,p);txt('BATTLE FOR #1',0,0,64,'#fff',OUT,12);ctx.restore();}
},
r1(u){
  stripes('#7B61FF','rgba(255,255,255,.09)');
  card(380,150,840,660);
  txt('🏆 LLM LEADERBOARD',800,215,46,OUT,null);
  const rowY=i=>330+i*150;
  for(let i=0;i<3;i++){rr(420,rowY(i)-60,760,120,22);ctx.fillStyle=i===0?'#FFF0B3':'#EFE9FF';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OUT;ctx.stroke();
    txt('#'+(i+1),485,rowY(i)+3,58,['#FFB800','#C3CCD6','#D08A4E'][i],OUT,8);}
  const swaps=[.45,1.15,1.85];
  const slot=start=>{let p=start;for(const s0 of swaps){const q=clamp((u-s0)/.42);if(q<=0)break;const tg=1-p;if(q<1)return{pos:lerp(p,tg,easeIO(q)),q,up:tg<p};p=tg;}return{pos:p,q:0,up:false};};
  const list=[['claude',slot(1)],['gpt',slot(0)]].sort((a,b)=>(a[1].up?1:0)-(b[1].up?1:0));
  for(const [k,o] of list){
    const y=rowY(o.pos), arc=Math.sin(o.q*PI)*(o.up?-80:80), x=625+arc;
    fighter(k,x,y,44,{dir:1,mood:o.q>0&&!o.up?'shock':'angry',punch:o.up?Math.sin(o.q*PI):0,shadow:false,rot:Math.sin(o.q*PI)*(o.up?-.35:.35)});
    txt(k==='claude'?'Claude':'ChatGPT',715+arc,y+3,40,OUT,null,0,DISP,'left');
    const score=(k==='claude'?1287:1290)+Math.floor(u*(k==='claude'?36:34));
    txt(score.toLocaleString('en-US')+' pts',1150,y+2,30,'#4b4470',null,0,BODY,'right');
  }
  const mp=Math.sin(u*2.4);
  fighter('meta',625+mp*6,rowY(2),40,{mood:'smug',shadow:false,rot:mp*.06});
  txt('Meta',715,rowY(2)+3,40,OUT,null,0,DISP,'left'); txt('1,203 pts',1150,rowY(2)+2,30,'#4b4470',null,0,BODY,'right');
  swaps.forEach((s0,i)=>pow(470+i*40,(rowY(0)+rowY(1))/2,78,['POW!','BAM!','ZAP!'][i],u-s0-.12,.45,i%2?.18:-.18));
  banner('ROUND 1: LEADERBOARD',u,1.5);
},
r2(u){
  stripes('#FF6FB5','rgba(255,255,255,.13)');
  card(330,140,940,640);
  ctx.strokeStyle=OUT; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(330,212); ctx.lineTo(1270,212); ctx.stroke();
  ['#FF5F57','#FEBC2E','#28C840'].forEach((c,i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(380+i*34,176,11,0,7);ctx.fill();ctx.lineWidth=3;ctx.stroke();});
  txt('# who-is-better',800,178,30,OUT,null,0,BODY);
  rr(370,690,860,60,30); ctx.fillStyle='#EFE9FF'; ctx.fill(); ctx.lineWidth=4; ctx.stroke();
  txt('Type a message…',405,721,24,'#8a83a8',null,0,BODY,'left');
  if(u>.1&&u<.45) txt('ChatGPT is typing…',1195,655,22,'#8a83a8',null,0,BODY,'right');
  const bubble=(text,hx,hy,col,side,t0)=>{
    if(u<t0) return;
    ctx.font=`34px ${BODY}`; const w=ctx.measureText(text).width+60, h=80;
    const f=easeIn((u-1.75)/.3), cx=lerp(side<0?400+w/2:1200-w/2,800,f), cy=lerp(hy,420,f);
    if(u>=2.05) return;
    const sc=backOut((u-t0)/.25)*(1-.3*f);
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(f*side*-1.3); ctx.scale(sc,sc);
    ctx.fillStyle=col; ctx.strokeStyle=OUT; ctx.lineWidth=5; ctx.lineJoin='round';
    const tx=side*(w/2-34); ctx.beginPath(); ctx.moveTo(tx-14,h/2-6); ctx.lineTo(tx+side*22,h/2+26); ctx.lineTo(tx+14,h/2-6); ctx.fill(); ctx.stroke();
    rr(-w/2,-h/2,w,h,32); ctx.fill(); ctx.stroke();
    txt(text,0,2,34,'#fff',null,0,BODY); ctx.restore();
  };
